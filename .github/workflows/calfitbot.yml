name: CalFitBot integration
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: calfitbot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  protocol-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Protocol, persistence and recovery tests
        run: dotnet run --project tests/CalFitBot.Tests
      - name: Compile actual scanner in browser harness
        run: dotnet build tests/CalFitBot.Preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: tests/CalFitBot.Preview
      - run: npx playwright install --with-deps chromium
        working-directory: tests/CalFitBot.Preview
      - name: Browser workflow
        working-directory: tests/CalFitBot.Preview
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --no-build --urls http://127.0.0.1:3033 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3033 >/dev/null; then break; fi
            sleep 1
          done
          node browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calfitbot-browser-evidence
          path: |
            tests/CalFitBot.Preview/artifacts/
            tests/CalFitBot.Preview/preview.log
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install maui-android --version 10.0.400
      - name: Build simulation APK
        run: dotnet build CalFit/CalFit.csproj -t:SignAndroidPackage -c Debug -f net10.0-android -r android-arm64 -p:CalFitBotSimulation=true -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalFitBot-simulator-debug-apk
          path: CalFit/bin/Debug/net10.0-android/android-arm64/*-Signed.apk
          if-no-files-found: error
      - name: Clean simulation build before physical-device build
        run: dotnet clean CalFit/CalFit.csproj -c Debug -f net10.0-android -r android-arm64
      - name: Build real-device APK
        run: dotnet build CalFit/CalFit.csproj -t:SignAndroidPackage -c Debug -f net10.0-android -r android-arm64 -p:CalFitBotSimulation=false -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalFitBot-real-device-debug-apk
          path: CalFit/bin/Debug/net10.0-android/android-arm64/*-Signed.apk
          if-no-files-found: error
      - name: Compile production configuration without simulator
        run: dotnet build CalFit/CalFit.csproj -c Release -f net10.0-android -r android-arm64 -p:RunAOTCompilation=false -p:CalFitBotSimulation=false
